  <style>
    body {
      background: #F9FAFB;

      -webkit-font-smoothing: antialiased;
      position: relative;
    }
    .fade-in { animation: fadeIn .35s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .option-active {
      border-color: #BC36F0;
      background: #FAEEFF;
      color: #7D0096;
      box-shadow: 0 0 0 3px rgba(188,54,240,0.12);
    }

    /* Responsive hardening: prevent text / controls from overflowing containers */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    #app {
      width: 100%;
    }

    h1, h2, h3, h4, p, span, li, button, label, input, textarea {
      overflow-wrap: normal;
      word-break: normal;
      hyphens: auto;
    }

    h1 {
      font-size: clamp(2rem, 5.8vw, 3.75rem);
      line-height: 1.08;
    }

    h2 {
      font-size: clamp(1.75rem, 4.2vw, 3rem);
      line-height: 1.12;
    }

    h3 {
      font-size: clamp(1.15rem, 2.6vw, 1.5rem);
      line-height: 1.22;
    }

    h4 {
      font-size: clamp(1rem, 2.2vw, 1.125rem);
      line-height: 1.28;
    }

    p, li, button, label, input, textarea {
      font-size: clamp(0.875rem, 1.4vw, 1rem);
      line-height: 1.55;
    }

    button {
      max-width: 100%;
      white-space: normal;
      text-wrap: balance;
    }

    img, svg {
      max-width: 100%;
    }

    @media (max-width: 640px) {
      body {
        font-size: 15px;
      }

      main#app {
        padding-left: 1rem;
        padding-right: 1rem;
        padding-top: 5.5rem;
      }

      .shadow-soft {
        box-shadow: 0 6px 18px rgba(17,24,39,0.07);
      }

      h1 {
        font-size: clamp(1.85rem, 8.5vw, 2.75rem) !important;
        line-height: 1.08 !important;
      }

      h2 {
        font-size: clamp(1.55rem, 7vw, 2.25rem) !important;
        line-height: 1.12 !important;
      }

      .rounded-\[28px\] {
        border-radius: 1.25rem !important;
      }
    }


    .text-balance {
      text-wrap: balance;
    }

    .text-pretty {
      text-wrap: pretty;
    }

    .min-w-0 {
      min-width: 0;
    }

    .overflow-safe {
      overflow: hidden;
    }

    @media (max-width: 420px) {
      p, li, button, label, input, textarea {
        font-size: 0.875rem !important;
      }

      .tracking-\[0\.2em\] {
        letter-spacing: 0.12em !important;
      }
    }


    .radar-label {
      font-size: clamp(10px, 2.4vw, 12px);
      line-height: 1.15;
      color: #7D0096;
      font-weight: 600;
      text-align: center;
      hyphens: auto;
      overflow-wrap: normal;
      word-break: normal;
    }

    @media (max-width: 420px) {
      .radar-label {
        font-size: 10px;
      }
    }

    @media print {
      body {
        background: white;
      }

      #contact-modal,
      button {
        display: none !important;
      }

      main#app {
        max-width: 100% !important;
        padding: 0 !important;
      }

      .shadow-soft,
      .shadow-md,
      .shadow-sm {
        box-shadow: none !important;
      }
    }

  </style>
</head>

          </p>
        </div>
        <button onclick="closeModal()" class="shrink-0 text-gray-400 hover:text-brand-xdark text-xl leading-none" aria-label="Schließen">×</button>

          <input id="contact-name" required class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-main" />
        </div>

        <div>

          <input id="contact-email" type="email" required class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-main" />
        </div>

        <div>
          <label id="org-label" for="contact-org" class="block text-sm font-medium mb-1">Labor / Organisation *</label>
          <input id="contact-org" required class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-main" />
        </div>

        </div>

        <div class="rounded-xl bg-gray-50 border border-gray-100 p-4">
          <label for="privacy-consent" class="grid grid-cols-[auto_1fr] gap-3 text-sm text-nordic-textPrimary leading-relaxed">
            <input

              type="checkbox"
              class="mt-1 h-4 w-4 rounded border-gray-300 text-roche focus:ring-roche"
              onchange="toggleSubmitButton()"

            />
            <span class="min-w-0 text-pretty">

                class="text-brand-xdark underline hover:text-brand-dark"

            </span>
          </label>
        </div>

        <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-2">

        </div>
      </form>
    </div>

    function setLanguage(lang) {
      state.language = lang;
      refreshModalLanguage();
      render();

    const app = document.getElementById('app');

    function loadAnswers() {
      try {
        return JSON.parse(localStorage.getItem('labscan_answers_v2') || '{}');
      } catch (error) {
        return {};
      }
    }

    function saveAnswers() {
      localStorage.setItem('labscan_answers_v2', JSON.stringify(state.answers));
    }

    function clearAnswers() {
      localStorage.removeItem('labscan_answers_v2');
    }

    function getAnsweredCount() {
      return Object.keys(state.answers).length;
    }

    function scoreForQuestion(questionId, answerValue) {
      // 3er-Skala:
      // Positive Fragen: voll=3, teilweise=2, gar nicht=1.
      // Negative Fragen: voll=1, teilweise=2, gar nicht=3.
      return reverseScored.has(questionId) ? 4 - answerValue : answerValue;
    }

    function getQuestionOptions(questionIndex) {
      // Die Antwortmöglichkeiten bleiben bewusst konsistent.
      // Die Bewertung wird bei positiv formulierten Fragen intern invertiert,
      // damit die Nutzerführung klar bleibt.
      return [...answerScale];
    }

    function getClusterScores() {
      const clusters = { Logistik: 0, Organisation: 0, Digitalisierung: 0, Prozesse: 0 };
      questions.forEach((q, index) => {
        const answer = state.answers[index];
        if (answer) clusters[q.cluster] += scoreForQuestion(q.id, answer);
      });
      return clusters;
    }

    function getClusterLevel(cluster, score) {
      const thresholds = {
        // 3er-Skala: je Frage 1 bis 3 Punkte.
        // Logik:
        // - Reifegrad hoch / Handlungsbedarf niedrig nur bei voller Punktzahl im Cluster.
        // - Sobald mindestens ein Optimierungspunkt erkannt wird, fällt der Cluster mindestens auf mittel.
        // - Bei deutlichen Abweichungen wird der Cluster auf Reifegrad tief / Handlungsbedarf hoch gesetzt.
        Logistik: { lowMax: 1, maxScore: 3 },
        Organisation: { lowMax: 4, maxScore: 9 },
        Digitalisierung: { lowMax: 6, maxScore: 12 },
        Prozesse: { lowMax: 3, maxScore: 6 }
      };

      const t = thresholds[cluster];
      if (score === t.maxScore) return 'high';
      if (score <= t.lowMax) return 'low';
      return 'mid';
    }

    function getConsultingNeed(levelKey) {
      const labels = {
        de: { low: 'Handlungsbedarf hoch', mid: 'Handlungsbedarf mittel', high: 'Handlungsbedarf niedrig' },
        en: { low: 'High need for action', mid: 'Medium need for action', high: 'Low need for action' },
        fr: { low: 'Besoin d’action élevé', mid: 'Besoin d’action moyen', high: 'Besoin d’action faible' },
        it: { low: 'Bisogno di intervento elevato', mid: 'Bisogno di intervento medio', high: 'Bisogno di intervento basso' }
      };
      return (labels[state.language] || labels.de)[levelKey];
    }

    function getMaturityLabel(levelKey) {
      const labels = {
        de: { low: 'Reifegrad tief', mid: 'Reifegrad mittel', high: 'Reifegrad hoch' },
        en: { low: 'Low maturity', mid: 'Medium maturity', high: 'High maturity' },
        fr: { low: 'Maturité faible', mid: 'Maturité moyenne', high: 'Maturité élevée' },
        it: { low: 'Maturità bassa', mid: 'Maturità media', high: 'Maturità alta' }
      };
      return (labels[state.language] || labels.de)[levelKey];
    }

    function getMaturityShort(levelKey) {
      const labels = {
        de: { low: 'tief', mid: 'mittel', high: 'hoch' },
        en: { low: 'low', mid: 'medium', high: 'high' },
        fr: { low: 'faible', mid: 'moyenne', high: 'élevée' },
        it: { low: 'bassa', mid: 'media', high: 'alta' }
      };
      return (labels[state.language] || labels.de)[levelKey];
    }

    function getMaxScore(cluster) {
      const counts = { Logistik: 1, Organisation: 3, Digitalisierung: 4, Prozesse: 2 };
      return counts[cluster] * 3;
    }

    function getMinScore(cluster) {
      const counts = { Logistik: 1, Organisation: 3, Digitalisierung: 4, Prozesse: 2 };
      return counts[cluster] * 1;
    }

    function getNeedPercentage(cluster, maturityScore) {
      const min = getMinScore(cluster);
      const max = getMaxScore(cluster);
      const needScore = max - maturityScore + min;
      return Math.round(((needScore - min) / (max - min)) * 100);
    }

    
    function getClusterResults() {
      const scores = getClusterScores();
      return Object.entries(scores).map(([cluster, score]) => {
        const levelKey = getClusterLevel(cluster, score);
        return {
          cluster,
          score,
          levelKey,
          needLabel: getConsultingNeed(levelKey),
          maturityLabel: getMaturityLabel(levelKey),
          maturityShort: getMaturityShort(levelKey),
          needPct: getNeedPercentage(cluster, score),
          ...getClusterText(cluster, levelKey)
        };
      });
    }

    function getTopHandlungsfelder() {
      return getClusterResults()
        .sort((a, b) => {
          // Priorisierung nach Handlungsbedarf: Niedrigster Reifegrad zuerst.
          const rank = { low: 3, mid: 2, high: 1 };
          if (rank[a.levelKey] !== rank[b.levelKey]) return rank[b.levelKey] - rank[a.levelKey];
          return a.score - b.score;
        })
        .slice(0, 3);
    }

    function render() {
      localizeQuestions();
      if (state.step === 'start') renderStart();
      else if (state.step === 'quiz') renderQuiz();
      else if (state.step === 'loading') renderLoading();
      else if (state.step === 'result') renderResults();
    }

    function startQuiz(reset = false) {
      if (reset) {
        state.answers = {};
        clearAnswers();
        state.currentQ = 0;
      } else {
        state.currentQ = Math.min(getAnsweredCount(), questions.length - 1);
      }
      state.step = 'quiz';
      render();
    }

    function answerQuestion(value) {
      state.answers[state.currentQ] = value;
      saveAnswers();
      if (state.currentQ < questions.length - 1) {
        state.currentQ += 1;
        render();
      } else {
        state.step = 'loading';
        render();
        setTimeout(() => {
          state.step = 'result';
          render();
        }, 650);
      }
    }

    function restartQuiz() {
      state.step = 'start';
      state.currentQ = 0;
      state.answers = {};
      clearAnswers();
      render();
    }

    function goBack() {
      if (state.currentQ > 0) {
        state.currentQ -= 1;
        render();
      }
    }

    function jumpToQuestion(index) {
      state.currentQ = index;
      state.step = 'quiz';
      render();
    }

    function getRadarChart(results) {
      const size = 380;
      const center = 190;
      const maxRadius = 112;
      const labelBoxWidth = 92;
      const labelBoxHeight = 34;
      const levels = [0.25, 0.5, 0.75, 1];

      const points = results.map((r, index) => {
        const angle = -Math.PI / 2 + (index * 2 * Math.PI / results.length);
        const safeNeedPct = Math.max(0, Math.min(100, r.needPct));
        const radius = (safeNeedPct / 100) * maxRadius;
        const labelDistance = maxRadius + 42;
        const labelCenterX = center + Math.cos(angle) * labelDistance;
        const labelCenterY = center + Math.sin(angle) * labelDistance;

        return {
          x: center + Math.cos(angle) * radius,
          y: center + Math.sin(angle) * radius,
          axisX: center + Math.cos(angle) * maxRadius,
          axisY: center + Math.sin(angle) * maxRadius,
          labelX: labelCenterX - labelBoxWidth / 2,
          labelY: labelCenterY - labelBoxHeight / 2,
          label: r.cluster,
          value: safeNeedPct
        };
      });

      const grid = levels.map(level => {
        const radius = maxRadius * level;
        const polygonPoints = results.map((_, index) => {
          const angle = -Math.PI / 2 + (index * 2 * Math.PI / results.length);
          return `${center + Math.cos(angle) * radius},${center + Math.sin(angle) * radius}`;
        }).join(' ');
        return `<polygon points="${polygonPoints}" fill="none" stroke="#E5E7EB" stroke-width="1"></polygon>`;
      }).join('');

      const axes = points.map(p => `
        <line x1="${center}" y1="${center}" x2="${p.axisX}" y2="${p.axisY}" stroke="#E5E7EB" stroke-width="1"></line>
      `).join('');

      const polygon = points.map(p => `${p.x},${p.y}`).join(' ');
      const markers = points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#BC36F0"></circle>`).join('');

      const textLabels = points.map(p => `
        <foreignObject x="${p.labelX}" y="${p.labelY}" width="${labelBoxWidth}" height="${labelBoxHeight}">
          <div xmlns="http://www.w3.org/1999/xhtml" lang="de" class="radar-label">
            ${p.label}
          </div>
        </foreignObject>
      `).join('');

      const legend = results.map(r => `
        <div class="flex items-center justify-between gap-3 rounded-xl bg-brand-xlight px-4 py-3 min-w-0">
          <span class="text-sm font-medium text-brand-xdark min-w-0 text-pretty">${clusterIcons[r.cluster]} ${clusterName(r.cluster)}</span>
          <span class="text-sm text-nordic-textPrimary shrink-0">${Math.max(0, Math.min(100, r.needPct))}%</span>
        </div>
      `).join('');

      return `
        <div class="rounded-[28px] bg-white p-6 md:p-8 border border-gray-100 shadow-soft mb-8 overflow-hidden">
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-8 items-center">
            <div class="min-w-0">
              <h3 class="text-xl font-semibold text-brand-xdark mb-3">${t('needChartTitle')}</h3>
              <p class="text-sm text-nordic-textSecondary leading-relaxed max-w-xl min-w-0 text-pretty mb-5">
                ${t('needChartText')}
              </p>
              <div class="grid gap-3">
                ${legend}
              </div>
            </div>
            <div class="w-full max-w-md mx-auto min-w-0">
              <svg viewBox="0 0 ${size} ${size}" class="w-full h-auto block" role="img" aria-label="Spiderdiagramm Handlungsbedarf">
                ${grid}
                ${axes}
                <polygon points="${polygon}" fill="rgba(188,54,240,0.18)" stroke="#BC36F0" stroke-width="2"></polygon>
                ${markers}
                ${textLabels}
              </svg>
            </div>
          </div>
        </div>
      `;
    }

    function renderResults() {
      const results = getClusterResults();
      const topFields = getTopHandlungsfelder();

      const indicatorLabels = results.map(r => `<span class="text-xs text-nordic-textSecondary">${clusterName(r.cluster)}</span>`).join('');
      const scoreHtml = results.map(r => {
        const barPct = Math.max(0, Math.min(100, 100 - r.needPct));
        return `
        <div class="rounded-2xl bg-white p-5 border border-gray-100">
          <div class="flex items-center justify-between gap-4 mb-3">
            <h4 class="text-sm font-semibold text-brand-xdark flex items-center gap-2">${clusterIcons[r.cluster]} ${clusterName(r.cluster)}</h4>
            <span class="text-sm text-nordic-textSecondary capitalize">${r.maturityShort}</span>
          </div>
          <div class="h-2 bg-gray-200 rounded-full overflow-hidden mb-3" title="Balken zeigt den Reifegrad">
            <div class="h-full bg-brand-dark" style="width:${Math.max(0, Math.min(100, barPct))}%"></div>
          </div>
          <div class="flex items-center justify-between gap-3 text-xs text-nordic-textSecondary">
            <span>${t('maturity')}</span>
            <span>${barPct}%</span>
          </div>
        </div>
      `;
      }).join('');

      const statusHtml = results.map(r => `
        <div class="rounded-[28px] bg-brand-light p-6 md:p-8 overflow-hidden">
          <div class="flex items-start gap-4 mb-5">
            <div class="shrink-0 text-brand-xdark mt-1">
              ${clusterIcons[r.cluster]}
            </div>
            <div class="min-w-0">
              <p class="text-[11px] uppercase tracking-[0.25em] text-brand-dark font-semibold mb-1">${t('statusquo')}</p>
              <h3 class="text-2xl md:text-3xl font-light text-brand-xdark leading-tight text-balance">
                ${clusterName(r.cluster)}
              </h3>
            </div>
          </div>
          <p class="text-sm md:text-[15px] leading-relaxed text-nordic-textPrimary text-pretty">
            ${getClusterText(r.cluster, r.levelKey).status}
          </p>
        </div>
      `).join('');

      const topHtml = topFields.map((r, index) => `
        <div class="rounded-2xl bg-white p-6 border border-gray-100 shadow-soft">
          <div class="flex items-start justify-between gap-4">
            <div>
              <p class="text-xs uppercase tracking-[0.2em] text-brand-dark font-semibold mb-2">Handlungsfeld ${index + 1}</p>
              <h4 class="text-lg font-semibold text-brand-xdark">${clusterName(r.cluster)}</h4>
              <p class="mt-3 text-sm text-nordic-textPrimary leading-relaxed">${getClusterText(r.cluster, r.levelKey).action}</p>
            </div>
            <span class="shrink-0 rounded-full bg-brand-xlight text-brand-xdark text-xs font-semibold px-3 py-1">${r.needLabel}</span>
          </div>
        </div>
      `).join('');

      app.innerHTML = `
        <section class="fade-in pt-16 md:pt-6 pb-16">
          <div class="text-center mb-12">
            <p class="text-xs uppercase tracking-[0.2em] text-brand-dark font-semibold mb-2">${t('result')}</p>
            <h2 class="text-3xl md:text-5xl font-light text-brand-xdark">${t('resultTitle')}</h2>
            <p class="mt-4 text-nordic-textSecondary max-w-2xl mx-auto">${t('resultText')}</p>
          </div>

          <div class="rounded-[28px] bg-white p-6 md:p-8 border border-gray-100 shadow-soft mb-8">
            <div class="mb-6">
              <p class="text-xs uppercase tracking-[0.2em] text-brand-dark font-semibold mb-2">Cluster-${t('loading')}</p>
              <h3 class="text-2xl font-semibold text-brand-xdark">${t('maturity')}</h3>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5">${scoreHtml}</div>
          </div>

          ${getRadarChart(results)}

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-8 mb-8">
            ${statusHtml}
          </div>

          <div class="mb-8">
            <h3 class="text-2xl font-semibold text-brand-xdark mb-5">${t('topFields')}</h3>
            <div class="grid gap-5">${topHtml}</div>
          </div>

          <div class="rounded-[28px] bg-brand-dark text-white p-6 md:p-8 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6 overflow-hidden">
            <div class="max-w-2xl min-w-0">
              <h3 class="text-2xl font-semibold mb-2">${t('nextStep')}</h3>
              <p class="text-brand-xlight text-sm leading-relaxed">${t('nextStepText')}</p>
            </div>
            <div class="flex flex-wrap gap-3 max-w-full">
              <button onclick="openModal()" class="px-5 py-3 rounded-2xl bg-white text-brand-xdark font-semibold hover:bg-brand-xlight">${t('consulting')}</button>
              <button onclick="printReport()" class="px-5 py-3 rounded-2xl border border-white/30 text-white font-medium hover:bg-white/10">${t('print')}</button>
            </div>
          </div>

          <div class="mt-8 flex flex-wrap gap-3 justify-center">
            <button onclick="adjustAnswers()" class="px-5 py-3 rounded-2xl border border-gray-200 bg-white font-medium hover:bg-gray-50">${t('adjust')}</button>
            <button onclick="restartQuiz()" class="px-5 py-3 rounded-2xl border border-gray-200 bg-white font-medium hover:bg-gray-50">${t('restartQuiz')}</button>
          </div>
        </section>
      `;
    }

    function openModal() {
      refreshModalLanguage();
      const modal = document.getElementById('contact-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      toggleSubmitButton();
    }

    function closeModal() {
      const modal = document.getElementById('contact-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toggleSubmitButton() {
      const checkbox = document.getElementById('privacy-consent');
      const button = document.getElementById('submit-request-button');
      if (checkbox && button) {
        button.disabled = !checkbox.checked;
      }
    }

    function submitForm(event) {
      event.preventDefault();

      const consent = document.getElementById('privacy-consent');
      if (!consent || !consent.checked) {
        alert(t('privacyAlert'));
        return;
      }

      const name = document.getElementById('contact-name').value;
      const email = document.getElementById('contact-email').value;
      const org = document.getElementById('contact-org').value;
      const msg = document.getElementById('contact-message').value || '-';

      const clusterResults = getClusterResults();
      const topFelder = getTopHandlungsfelder();

      const clusterText = clusterResults.map(item => `- ${item.cluster}: ${item.needLabel} / ${item.maturityLabel}`).join('\n');
      const felderText = topFelder.map((f, index) => `${index + 1}. ${f.cluster}: ${f.action}`).join('\n\n');

      const subject = encodeURIComponent(`LabScan Beratungsanfrage: ${org}`);
      const bodyText = `Guten Tag Herr Sommer,\n\nhiermit möchte ich eine LabScan Beratung anfragen.\n\nMeine Kontaktdaten:\nName: ${name}\nE-Mail: ${email}\nLabor/Organisation: ${org}\n\nNachricht:\n${msg}\n\n---\nMeine Ergebnisse aus dem Labor-Potenzial-Rechner:\n\nClusterbewertung:\n${clusterText}\n\nTop 3 Handlungsfelder:\n${felderText}\n\nFreundliche Grüsse\n${name}`;
      const body = encodeURIComponent(bodyText);

      const mailtoUrl = `mailto:joel.sommer@roche.com?subject=${subject}&body=${body}`;

      // Robuster als window.location.href, besonders bei lokal geöffneten HTML-Dateien.
      const mailLink = document.createElement('a');
      mailLink.href = mailtoUrl;
      mailLink.style.display = 'none';
      document.body.appendChild(mailLink);

      if (navigator.clipboard) {
        navigator.clipboard.writeText(bodyText).catch(() => {});
      }

      window.open(mailtoUrl, '_blank');
      document.body.removeChild(mailLink);

      closeModal();
      setTimeout(() => {
        alert('Die E-Mail wurde vorbereitet. Falls sich kein Mailfenster öffnet, ist auf diesem Gerät vermutlich kein Standard-Mailprogramm für mailto: verknüpft. Der Text wurde, wenn vom Browser erlaubt, zusätzlich in die Zwischenablage kopiert.');
      }, 250);
    }

    function printReport() {
  // Kleine Verzögerung verbessert die Kompatibilität in Chrome/Edge nach dynamischem Rendering.
  setTimeout(function () {
    window.focus();
    window.print();
  }, 100);
}

function adjustAnswers() {
  // Immer bei Frage 1 starten, Antworten behalten
  state.step = 'quiz';
  state.currentQ = 0;
  render();
}

window.startQuiz = startQuiz;
    window.answerQuestion = answerQuestion;
    window.restartQuiz = restartQuiz;
    window.goBack = goBack;
    window.jumpToQuestion = jumpToQuestion;
    window.openModal = openModal;
    window.closeModal = closeModal;
    window.submitForm = submitForm;
window.adjustAnswers = adjustAnswers;
window.printReport = printReport;
window.setLanguage = setLanguage;
window.toggleSubmitButton = toggleSubmitButton;

    render();
    refreshModalLanguage();
  </script>
</body>
</html>
