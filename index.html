<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labor-Potenzial-Rechner</title>
    <!-- Tailwind CSS für einfaches, sauberes Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Nordic Typografie: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        roche: '#0066CC', // Offizielles Roche Blau
                        brand: {
                            xdark: '#7D0096',   // Headlines & primäre Icons
                            dark: '#BC36F0',    // Haupt-Grafikelemente & Pfeile
                            main: '#E085FC',    // Highlights
                            light: '#F2D4FF',   // Sekundäre Boxen
                            xlight: '#FAEEFF',  // Hintergrund für „Key Takeaway“-Boxen
                        },
                        nordic: {
                            bg: '#F9FAFB',
                            card: '#FFFFFF',
                            textPrimary: '#111827',
                            textSecondary: '#6B7280',
                            accent: '#475569',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F9FAFB;
            color: #111827;
            -webkit-font-smoothing: antialiased;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans relative">

    <!-- Roche Logo (Oben Rechts) -->
    <div class="absolute top-6 right-6 md:top-8 md:right-10 z-40">
        <img src="https://upload.wikimedia.org/wikipedia/commons/f/f5/Hoffmann-La_Roche_logo.svg" alt="Roche Logo" class="h-10 md:h-12 w-auto drop-shadow-sm">
    </div>

    <!-- Container für die App -->
    <div id="app" class="flex-grow flex flex-col items-center p-6 md:p-12 w-full max-w-5xl mx-auto transition-all duration-300">
        <!-- Content wird durch JS injiziert -->
    </div>

    <!-- Kontakt-Modal -->
    <div id="contact-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div id="contact-modal-content" class="bg-white rounded-lg p-8 max-w-md w-full shadow-2xl transform scale-95 transition-transform duration-300 relative">
            <h3 class="text-2xl font-light text-brand-xdark mb-2">Beratung anfragen</h3>
            <p class="text-sm text-nordic-textSecondary mb-6 leading-relaxed">Bitte hinterlassen Sie Ihre Angaben. Wir bereiten Ihre Auswertung auf und melden uns bei Ihnen.</p>
            
            <form id="contact-form" onsubmit="submitForm(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Name / Vorname *</label>
                        <input type="text" id="contact-name" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-brand-dark focus:ring-1 focus:ring-brand-dark text-sm transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">E-Mail Adresse *</label>
                        <input type="email" id="contact-email" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-brand-dark focus:ring-1 focus:ring-brand-dark text-sm transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Labor / Organisation *</label>
                        <input type="text" id="contact-org" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-brand-dark focus:ring-1 focus:ring-brand-dark text-sm transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Bemerkung (Optional)</label>
                        <textarea id="contact-message" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-brand-dark focus:ring-1 focus:ring-brand-dark text-sm transition-colors resize-none"></textarea>
                    </div>
                </div>
                
                <div class="mt-8 flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 text-sm text-gray-500 hover:text-brand-xdark transition-colors font-medium">Abbrechen</button>
                    <!-- Der Senden-Button bleibt im Roche Blau für die Marken-Wiedererkennung beim Absenden -->
                    <button type="submit" class="px-5 py-2.5 bg-roche text-white text-sm font-medium rounded hover:bg-blue-800 transition-colors shadow-sm">Anfrage senden</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- ICONS (SVG Strings) ---
        const icons = {
            activity: `<svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13h2l2 3 2-6 1 3h3" /></svg>`,
            settings: `<svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>`,
            laptop: `<svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25" /></svg>`,
            users: `<svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>`,
            barChart: `<svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" /></svg>`,
            clipboard: `<svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z" /></svg>`,
            check: `<svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>`,
            arrowRight: `<svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" /></svg>`
        };

        // --- DATEN ---
        const questions = [
            { category: "Prozesse & Workflow", icon: icons.activity, text: "Die Sortierung und Verteilung der Proben im Probeneingang erfolgt händisch durch Mitarbeitende." },
            { category: "Prozesse & Workflow", icon: icons.activity, text: "Eine Steigerung des Probenvolumens um 20% erfordert im aktuellen Setup eine proportionale Aufstockung des Personals." },
            { category: "Prozesse & Workflow", icon: icons.settings, text: "Die räumliche Anordnung der Analysegeräte resultiert aus historischen Gegebenheiten und bildet nicht den aktuellen Probenfluss ab." },
            { category: "Prozesse & Workflow", icon: icons.settings, text: "Der Versand von Spezialanalytik an externe Partnerlabore erfordert eine manuelle Datenerfassung oder Umetikettierung der Proben." },
            { category: "Digitalisierung & IT", icon: icons.laptop, text: "Die technische Validierung der Routine-Ergebnisse im Normbereich erfolgt überwiegend manuell durch das Fachpersonal." },
            { category: "Digitalisierung & IT", icon: icons.laptop, text: "Die verwendeten Subsysteme (z. B. Mikrobiologie) arbeiten als separate Datenbereiche ohne vollständige Integration in das LIS." },
            { category: "Digitalisierung & IT", icon: icons.laptop, text: "Die Erfassung von Aufträgen erfolgt teilweise papierbasiert oder erfordert eine manuelle Übertragung in das LIS." },
            { category: "Organisation & Führung", icon: icons.users, text: "Die Mitarbeitenden sind festen Arbeitsplätzen zugeordnet und rotieren selten bereichsübergreifend." },
            { category: "Organisation & Führung", icon: icons.barChart, text: "Die Überwachung der Durchlaufzeiten (TAT) basiert auf manuellen Stichproben statt auf Echtzeit-Dashboards." },
            { category: "Organisation & Führung", icon: icons.clipboard, text: "Die Bestandsverwaltung von Reagenzien wird durch visuelle Kontrolle und manuelle Nachbestellung gesteuert." }
        ];

        // --- STATE ---
        let state = {
            step: 'start', // 'start', 'quiz', 'loading', 'result'
            currentQ: 0,
            answers: {}
        };

        // --- LOGIK & DOM MANIPULATION ---
        const appDiv = document.getElementById('app');

        function render() {
            if (state.step === 'start') renderStart();
            else if (state.step === 'quiz') renderQuiz();
            else if (state.step === 'loading') renderLoading();
            else if (state.step === 'result') renderResults();
        }

        window.startQuiz = () => {
            state.step = 'quiz';
            state.currentQ = 0;
            state.answers = {};
            render();
        };

        window.answerQuestion = (val) => {
            state.answers[state.currentQ] = val;
            if (state.currentQ < questions.length - 1) {
                state.currentQ++;
                render();
            } else {
                state.step = 'loading';
                render();
                simulateLoading();
            }
        };

        window.restartQuiz = () => {
            state.step = 'start';
            render();
        };

        function simulateLoading() {
            let progress = 0;
            const progressEl = document.getElementById('loading-progress');
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 15) + 5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        state.step = 'result';
                        render();
                    }, 300);
                }
                if (progressEl) progressEl.innerText = progress + '%';
            }, 150);
        }

        function calculateScore() {
            let total = 0;
            for (let key in state.answers) {
                total += state.answers[key];
            }
            return total;
        }

        // --- MODAL LOGIK ---
        window.openModal = () => {
            const modal = document.getElementById('contact-modal');
            const content = document.getElementById('contact-modal-content');
            modal.classList.remove('hidden');
            // Trigger reflow für die Animation
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modal.classList.add('opacity-100');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        };

        window.closeModal = () => {
            const modal = document.getElementById('contact-modal');
            const content = document.getElementById('contact-modal-content');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        };

        window.submitForm = (e) => {
            e.preventDefault();
            
            // Formulardaten auslesen
            const name = document.getElementById('contact-name').value;
            const email = document.getElementById('contact-email').value;
            const org = document.getElementById('contact-org').value;
            const msg = document.getElementById('contact-message').value;

            // Resultatdaten auslesen
            const score = calculateScore();
            let level;
            if (score <= 18) level = "Wenig Handlungsbedarf";
            else if (score <= 28) level = "Mittleres Potenzial";
            else level = "Hohes Potenzial";

            // Email Betreff und Body generieren
            const subject = encodeURIComponent(`LabScan Beratungsanfrage: ${org}`);
            const body = encodeURIComponent(`Guten Tag Herr Sommer,

hiermit möchte ich eine LabScan Beratung anfragen.

Meine Kontaktdaten:
Name: ${name}
E-Mail: ${email}
Labor/Organisation: ${org}

Nachricht:
${msg || '-'}

---
Meine Ergebnisse aus dem Labor-Potenzial-Rechner:
Score: ${score} / 40
Identifizierter Status: ${level}

Top 3 Handlungsfelder für unser Labor:
1. Prozessglättung: Harmonisierung von Laufwegen und Auflösung von Silos zur Senkung der Durchlaufzeiten.
2. Kosten pro Befund: Automatisierung manueller Schritte zur Senkung der Produktionskosten und Erhöhung der Widerstandsfähigkeit.
3. Digitale Validierung: Regelbasierte Auto-Validation zur Entlastung des Fachpersonals von repetitiven Tätigkeiten.

Freundliche Grüsse
${name}`);

            // Email Client öffnen
            window.location.href = `mailto:joel.sommer@roche.com?subject=${subject}&body=${body}`;
            
            // Modal schliessen und UI Feedback
            closeModal();
            setTimeout(() => {
                alert("Ihr E-Mail-Programm wurde geöffnet. Sie können die Nachricht dort vor dem Senden noch anpassen.");
            }, 400);
        };

        // --- VIEWS ---
        function renderStart() {
            appDiv.className = "flex-grow flex flex-col items-center justify-center p-6 w-full max-w-3xl mx-auto pt-24 md:pt-12";
            appDiv.innerHTML = `
                <div class="fade-in w-full text-center space-y-8">
                    <p class="text-brand-dark tracking-widest uppercase text-xs font-semibold mb-4">Assessment</p>
                    <h1 class="text-4xl md:text-5xl font-light text-brand-xdark tracking-tight">
                        Labor-Potenzial-Rechner
                    </h1>
                    <p class="text-lg text-nordic-textSecondary leading-relaxed max-w-2xl mx-auto font-light">
                        Evaluieren Sie Ihre Labororganisation anhand von 10 zentralen Faktoren. Ein minimalistisches Tool zur Ermittlung verborgener Effizienzreserven.
                    </p>
                    
                    <div class="my-12">
                        <button onclick="startQuiz()" class="inline-flex items-center gap-3 px-8 py-3 bg-brand-dark hover:bg-brand-xdark text-white rounded-md transition-colors font-medium text-sm">
                            <span>Analyse starten</span>
                            ${icons.arrowRight}
                        </button>
                    </div>

                    <div class="grid md:grid-cols-3 gap-6 text-left border-t border-gray-200 pt-8 mt-12">
                        <div>
                            <p class="text-brand-xdark font-medium text-sm mb-1">Dauer</p>
                            <p class="text-nordic-textSecondary text-xs">Ca. 2 Minuten</p>
                        </div>
                        <div>
                            <p class="text-brand-xdark font-medium text-sm mb-1">Umfang</p>
                            <p class="text-nordic-textSecondary text-xs">10 Indikatorenfragen</p>
                        </div>
                        <div>
                            <p class="text-brand-xdark font-medium text-sm mb-1">Ergebnis</p>
                            <p class="text-nordic-textSecondary text-xs">Sofortige Auswertung</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQuiz() {
            appDiv.className = "flex-grow flex flex-col items-center justify-center p-4 w-full max-w-2xl mx-auto pt-24 md:pt-12";
            const q = questions[state.currentQ];
            const progressPct = ((state.currentQ) / questions.length) * 100;

            appDiv.innerHTML = `
                <div class="fade-in w-full">
                    <!-- Minimalist Progress -->
                    <div class="mb-12">
                        <div class="flex justify-between text-xs text-nordic-textSecondary mb-3 uppercase tracking-wide">
                            <span>Frage ${state.currentQ + 1} / ${questions.length}</span>
                            <span class="text-brand-dark font-medium">${q.category}</span>
                        </div>
                        <div class="w-full bg-gray-200 h-px">
                            <div class="bg-brand-dark h-px transition-all duration-300" style="width: ${progressPct}%"></div>
                        </div>
                    </div>

                    <!-- Question -->
                    <div class="mb-12">
                        <div class="text-brand-xdark mb-6">
                            ${q.icon}
                        </div>
                        <h2 class="text-2xl md:text-3xl font-light text-brand-xdark leading-snug">
                            ${q.text}
                        </h2>
                    </div>

                    <!-- Options -->
                    <div class="flex flex-col space-y-3">
                        <button onclick="answerQuestion(1)" class="w-full text-left px-6 py-4 border border-gray-200 rounded-md hover:border-brand-main hover:bg-brand-xlight hover:text-brand-xdark transition-colors text-sm font-medium text-nordic-textPrimary">
                            1. Trifft gar nicht zu
                        </button>
                        <button onclick="answerQuestion(2)" class="w-full text-left px-6 py-4 border border-gray-200 rounded-md hover:border-brand-main hover:bg-brand-xlight hover:text-brand-xdark transition-colors text-sm font-medium text-nordic-textPrimary">
                            2. Trifft eher nicht zu
                        </button>
                        <button onclick="answerQuestion(3)" class="w-full text-left px-6 py-4 border border-gray-200 rounded-md hover:border-brand-main hover:bg-brand-xlight hover:text-brand-xdark transition-colors text-sm font-medium text-nordic-textPrimary">
                            3. Trifft eher zu
                        </button>
                        <button onclick="answerQuestion(4)" class="w-full text-left px-6 py-4 border border-gray-200 rounded-md hover:border-brand-main hover:bg-brand-xlight hover:text-brand-xdark transition-colors text-sm font-medium text-nordic-textPrimary">
                            4. Trifft voll zu
                        </button>
                    </div>
                </div>
            `;
        }

        function renderLoading() {
            appDiv.className = "flex-grow flex flex-col items-center justify-center p-6 w-full max-w-xl mx-auto pt-24 md:pt-12";
            appDiv.innerHTML = `
                <div class="fade-in text-center">
                    <div class="w-12 h-12 mx-auto mb-6 relative">
                        <svg class="animate-spin text-gray-200" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle>
                            <path fill="#BC36F0" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                    <p class="text-sm uppercase tracking-widest text-brand-dark mb-2 font-medium">Auswertung</p>
                    <p class="text-2xl font-light text-brand-xdark" id="loading-progress">0%</p>
                </div>
            `;
        }

        function renderResults() {
            appDiv.className = "flex-grow flex flex-col items-start p-4 md:p-8 w-full max-w-4xl mx-auto pb-20 pt-24 md:pt-12";
            
            const score = calculateScore();
            let level, indicatorPos;
            
            if (score <= 18) {
                level = "Wenig Handlungsbedarf";
                indicatorPos = ((score - 10) / 30) * 100;
            } else if (score <= 28) {
                level = "Mittleres Potenzial";
                indicatorPos = ((score - 10) / 30) * 100;
            } else {
                level = "Hohes Potenzial";
                indicatorPos = ((score - 10) / 30) * 100;
            }

            appDiv.innerHTML = `
                <div class="fade-in w-full">
                    <!-- Header -->
                    <div class="mb-16 text-center">
                        <p class="text-xs uppercase tracking-widest text-brand-dark font-medium mb-2">Resultat</p>
                        <h2 class="text-3xl md:text-4xl font-light text-brand-xdark mb-12">Labor-Barometer</h2>
                        
                        <!-- Nordic Barometer (angepasst auf Brand Palette) -->
                        <div class="max-w-xl mx-auto relative px-4">
                            <div class="flex justify-between text-[10px] text-gray-400 uppercase tracking-widest mb-4">
                                <span>Optimiert</span>
                                <span>Potenzial</span>
                            </div>
                            
                            <!-- Track -->
                            <div class="w-full h-1 bg-brand-light relative rounded-full">
                                <div class="absolute top-1/2 -mt-2.5 w-1 h-5 bg-brand-dark shadow-sm transition-all duration-1000 ease-out" style="left: calc(${indicatorPos}% - 2px)"></div>
                                <div class="absolute top-0 left-1/3 w-px h-2 -mt-0.5 bg-brand-main"></div>
                                <div class="absolute top-0 left-2/3 w-px h-2 -mt-0.5 bg-brand-main"></div>
                            </div>
                            
                            <div class="mt-8">
                                <span class="inline-block px-4 py-1.5 border border-brand-main bg-white text-sm font-medium text-brand-xdark rounded">
                                    Status: ${level}
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Content Grid (Sekundäre Boxen in Light Purple) -->
                    <div class="grid md:grid-cols-2 gap-8 mb-16">
                        <div class="p-8 bg-brand-light rounded-lg shadow-sm">
                            <h3 class="text-lg font-medium text-brand-xdark mb-6">Status Quo</h3>
                            <ul class="space-y-4 text-sm text-nordic-textPrimary font-light leading-relaxed">
                                <li class="flex items-start gap-3">
                                    <div class="mt-0.5 text-brand-xdark">${icons.activity}</div>
                                    <span>Manuelle Schnittstellen ("Touchpoints") binden derzeit wertvolle Personalressourcen.</span>
                                </li>
                                <li class="flex items-start gap-3">
                                    <div class="mt-0.5 text-brand-xdark">${icons.laptop}</div>
                                    <span>Medienbrüche in der Datenverarbeitung limitieren die Skalierbarkeit bei Volumenwachstum.</span>
                                </li>
                                <li class="flex items-start gap-3">
                                    <div class="mt-0.5 text-brand-xdark">${icons.settings}</div>
                                    <span>Ressourcenverteilung folgt teils historischen Mustern anstatt einem optimalen Lean-Workflow.</span>
                                </li>
                            </ul>
                        </div>

                        <div class="p-8 bg-brand-light rounded-lg shadow-sm">
                            <h3 class="text-lg font-medium text-brand-xdark mb-6">Benchmark</h3>
                            <ul class="space-y-4 text-sm text-nordic-textPrimary font-light leading-relaxed">
                                <li class="flex items-start gap-3">
                                    <div class="mt-0.5 text-brand-dark">${icons.check}</div>
                                    <span><strong>Put and Forget:</strong> Führende Labore verarbeiten Proben ohne manuellen Eingriff bis zur Archivierung.</span>
                                </li>
                                <li class="flex items-start gap-3">
                                    <div class="mt-0.5 text-brand-dark">${icons.check}</div>
                                    <span><strong>Polyvalenz:</strong> Bereichsübergreifendes Personal federt Spitzenlasten ohne Personalaufbau ab.</span>
                                </li>
                                <li class="flex items-start gap-3">
                                    <div class="mt-0.5 text-brand-dark">${icons.check}</div>
                                    <span><strong>IT-Integration:</strong> >80% vollautomatische technische Validierung der Routineparameter.</span>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <!-- Hebel (Key Takeaway in Extra Light Purple) -->
                    <div class="mb-16 bg-brand-xlight p-8 md:p-10 rounded-lg shadow-sm">
                        <h3 class="text-xl font-medium text-brand-xdark mb-8 border-b border-brand-light pb-4">Top 3 Handlungsfelder</h3>
                        <div class="space-y-6">
                            <div class="flex flex-col md:flex-row gap-4 md:gap-8 items-start">
                                <span class="text-sm font-bold text-brand-dark w-8 pt-0.5">01</span>
                                <div>
                                    <h4 class="text-base font-medium text-brand-xdark mb-2">Prozessglättung</h4>
                                    <p class="text-sm font-light text-nordic-textPrimary">Harmonisierung von Laufwegen und Auflösung von Silos (z.B. Annahme vs. Analytik) senkt Durchlaufzeiten auch ohne neue Geräte.</p>
                                </div>
                            </div>
                            <div class="flex flex-col md:flex-row gap-4 md:gap-8 items-start">
                                <span class="text-sm font-bold text-brand-dark w-8 pt-0.5">02</span>
                                <div>
                                    <h4 class="text-base font-medium text-brand-xdark mb-2">Kosten pro Befund</h4>
                                    <p class="text-sm font-light text-nordic-textPrimary">Automatisierung manueller Schritte senkt die Produktionskosten und stärkt Ihre Widerstandsfähigkeit bei Tarifanpassungen.</p>
                                </div>
                            </div>
                            <div class="flex flex-col md:flex-row gap-4 md:gap-8 items-start">
                                <span class="text-sm font-bold text-brand-dark w-8 pt-0.5">03</span>
                                <div>
                                    <h4 class="text-base font-medium text-brand-xdark mb-2">Digitale Validierung</h4>
                                    <p class="text-sm font-light text-nordic-textPrimary">Regelbasierte Auto-Validation entlastet Fachpersonal von repetitiver Klick-Arbeit für wertschöpfende Aufgaben.</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Call to Action -->
                    <div class="bg-brand-dark text-white p-8 md:p-12 rounded-lg text-center md:text-left flex flex-col md:flex-row items-center justify-between gap-8 shadow-md">
                        <div class="max-w-lg">
                            <h3 class="text-xl font-medium mb-3 text-white">Der LabScan</h3>
                            <p class="text-sm font-light text-brand-xlight">Validieren Sie die Hypothesen vor Ort. Sie erhalten eine detaillierte Auswertung Ihrer Handlungsfelder in den Bereichen Kosten, Qualität und Zeit.</p>
                        </div>
                        <button onclick="openModal()" class="shrink-0 px-6 py-3 bg-white text-brand-xdark hover:bg-brand-xlight rounded transition-colors text-sm font-semibold shadow-sm">
                            Beratung anfragen
                        </button>
                    </div>

                    <!-- Reset -->
                    <div class="mt-12 text-center">
                        <button onclick="restartQuiz()" class="text-xs text-nordic-textSecondary hover:text-brand-dark uppercase tracking-widest transition-colors font-medium">
                            Neu starten
                        </button>
                    </div>
                </div>
            `;
        }

        // --- INIT ---
        render();
    </script>
</body>
</html>
