      const names = clusterNameTranslations[state.language] || clusterNameTranslations.de;
      return names[cluster] || cluster;
    }

    const privacyLinks = {
      de: 'https://www.roche.ch/datenschutzerklaerung/datenschutzerklaerung-roche-diagnostics',
      en: 'https://www.roche.ch/en/privacy-policy/privacy-notice-roche-diagnostics',
      fr: 'https://www.roche.ch/fr/la-protection-des-donnees-personnelles/declaration-generale-confidentialite-roche-diagnostics',
      it: 'https://www.roche.ch/it/privacy-policy/privacy-notice-roche-diagnostics'
    };

    function privacyLink() {
      return privacyLinks[state.language] || privacyLinks.de;
    }

    function setLanguage(lang) {
      state.language = lang;
      render();
    }

    const app = document.getElementById('app');

    function loadAnswers() {
      try {
        return JSON.parse(localStorage.getItem('labscan_answers_v2') || '{}');
      } catch (error) {
        return {};
      }
    }

    function saveAnswers() {
      localStorage.setItem('labscan_answers_v2', JSON.stringify(state.answers));
    }

    function clearAnswers() {
      localStorage.removeItem('labscan_answers_v2');
    }

    function getAnsweredCount() {
      return Object.keys(state.answers).length;
    }

    function getQuestionOptions(questionIndex) {
      return [...answerScale];
    }

    function render() {
      localizeQuestions();
      if (state.step === 'start') renderStart();
      else if (state.step === 'quiz') renderQuiz();
      else if (state.step === 'form') renderForm();
      else if (state.step === 'loading') renderLoading();
      else if (state.step === 'success') renderSuccess();
    }

    function startQuiz(reset = false) {
      if (reset) {
        state.answers = {};
        clearAnswers();
        state.currentQ = 0;
      } else {
        state.currentQ = Math.min(getAnsweredCount(), questions.length - 1);
      }
      
      if (questions[state.currentQ].isForm) {
        state.step = 'form';
      } else {
        state.step = 'quiz';
      }
      render();
    }

    function answerQuestion(value) {
      state.answers[state.currentQ] = value;
      saveAnswers();
      if (state.currentQ < questions.length - 1) {
        state.currentQ += 1;
        if (questions[state.currentQ].isForm) {
           state.step = 'form';
        }
        render();
      }
    }

    function restartQuiz() {
      state.step = 'start';
      state.currentQ = 0;
      state.answers = {};
      clearAnswers();
      render();
    }

    function goBack() {
      if (state.currentQ > 0) {
        state.currentQ -= 1;
        state.step = 'quiz';
        render();
      }
    }

    function jumpToQuestion(index) {
      state.currentQ = index;
      if (questions[index].isForm) {
        state.step = 'form';
      } else {
        state.step = 'quiz';
      }
      render();
    }

    function renderStart() {
      const hasProgress = getAnsweredCount() > 0;
      app.innerHTML = `
        <section class="min-h-[85vh] flex items-center">
          <div class="w-full grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-10 items-center fade-in pt-16 md:pt-6">
            <div>
              <p class="text-brand-dark tracking-[0.2em] uppercase text-xs font-semibold mb-4">${t('assessment')}</p>
              <h1 class="text-4xl md:text-6xl font-light text-brand-xdark tracking-tight leading-tight text-balance">${t('startTitle')}</h1>
              <p class="mt-5 text-lg text-nordic-textSecondary leading-relaxed max-w-xl min-w-0 text-pretty">${t('startText')}</p>
              <div class="mt-6 mb-6">
                <p class="text-xs uppercase tracking-[0.2em] text-brand-dark font-semibold mb-3">${t('language')}</p>
                <div class="flex flex-wrap gap-2">
                  ${Object.entries(languageLabels).map(([key, label]) => `
                    <button
                      onclick="setLanguage('${key}')"
                      class="px-4 py-2 rounded-xl border text-sm transition ${
                        state.language === key
                          ? 'bg-brand-dark text-white border-brand-dark'
                          : 'bg-white text-nordic-textPrimary border-gray-200 hover:bg-brand-xlight'
                      }"
                    >
                      ${label}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div class="mt-8 flex flex-wrap gap-3">
                <button onclick="startQuiz(false)" class="inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-brand-dark text-white font-medium hover:bg-brand-xdark">
                  <span>${hasProgress ? t('continue') : t('start')}</span>
                  ${icons.arrowRight}
                </button>
                ${hasProgress ? `<button onclick="startQuiz(true)" class="px-6 py-3 rounded-2xl border border-gray-200 font-medium hover:bg-white">${t('restart')}</button>` : ''}
              </div>
              ${hasProgress ? `<p class="mt-4 text-sm text-nordic-textSecondary">Zwischenstand gespeichert: ${getAnsweredCount()} von ${questions.length - 1} Fragen beantwortet.</p>` : ''}
            </div>
            <div class="bg-white rounded-[28px] shadow-soft p-6 md:p-8 border border-gray-100">
              <h2 class="text-lg font-semibold text-brand-xdark mb-4">${t('overview')}</h2>
              <ul class="space-y-3 text-sm text-nordic-textPrimary">
                <li>• ${t('overviewItems')[0]}</li>
                <li>• ${t('overviewItems')[1]}</li>
                <li>• ${t('overviewItems')[2]}</li>
              </ul>
            </div>
          </div>
        </section>
      `;
    }

    function renderQuiz() {
      const q = questions[state.currentQ];
      const progressPct = ((state.currentQ) / (questions.length)) * 100;
      const selected = state.answers[state.currentQ];
      const options = getQuestionOptions(state.currentQ);

      const pills = questions.map((question, i) => {
        const active = i === state.currentQ;
        const answered = i < questions.length - 1 ? !!state.answers[i] : false;
        
        let cls = '';
        if (active) cls = 'bg-brand-dark text-white border-brand-dark';
        else if (answered) cls = 'bg-brand-xlight text-brand-xdark border-brand-main';
        else cls = 'bg-white text-gray-400 border-gray-200';

        const content = question.isForm ? icons.check : (i + 1);

        return `<button onclick="jumpToQuestion(${i})" class="w-7 h-7 rounded-full text-xs border flex items-center justify-center ${cls}">${content}</button>`;
      }).join('');

      const optionHtml = options.map(opt => `
        <button onclick="answerQuestion(${opt.value})" class="w-full text-left px-5 py-4 rounded-2xl border border-gray-200 transition ${selected === opt.value ? 'option-active' : 'hover:border-brand-main hover:bg-brand-xlight'}">
          <span class="text-sm md:text-base font-medium">${t('options')[opt.labelKey]}</span>
        </button>
      `).join('');

      app.innerHTML = `
        <section class="max-w-3xl mx-auto pt-16 md:pt-6 fade-in">
          <div class="flex flex-wrap gap-2 mb-6">${pills}</div>
          <div class="flex justify-between text-xs uppercase tracking-wider text-nordic-textSecondary mb-3">
            <span>${t('question')} ${state.currentQ + 1} ${t('of')} ${questions.length - 1}</span>
            <span class="text-brand-dark font-semibold">${clusterName(q.cluster)}</span>
          </div>
          <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden mb-8">
            <div class="h-full bg-brand-dark transition-all duration-300" style="width:${progressPct}%"></div>
          </div>
          <div class="bg-white rounded-[28px] shadow-soft border border-gray-100 p-6 md:p-10">
            <div class="text-brand-xdark mb-5">${clusterIcons[q.cluster] || icons.clipboard}</div>
            <h2 class="text-2xl md:text-3xl font-light text-brand-xdark leading-snug max-w-2xl min-w-0 text-pretty">${q.text}</h2>
            <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${optionHtml}
            </div>
            <div class="mt-8 flex items-center justify-between gap-4">
              <button onclick="goBack()" ${state.currentQ === 0 ? 'disabled' : ''} class="inline-flex items-center gap-2 px-4 py-3 rounded-2xl border border-gray-200 text-sm font-medium ${state.currentQ === 0 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-gray-50'}">
                ${icons.arrowLeft} ${t('back')}
              </button>
              <p class="text-sm text-nordic-textSecondary">${t('answered')}: ${getAnsweredCount()} / ${questions.length - 1}</p>
            </div>
          </div>
        </section>
      `;
    }

    function renderForm() {
      const progressPct = ((questions.length - 1) / questions.length) * 100;
      
      const pills = questions.map((question, i) => {
        const active = i === questions.length - 1;
        const answered = i < questions.length - 1 ? !!state.answers[i] : false;
        
        let cls = '';
        if (active) cls = 'bg-brand-dark text-white border-brand-dark';
        else if (answered) cls = 'bg-brand-xlight text-brand-xdark border-brand-main';
        else cls = 'bg-white text-gray-400 border-gray-200';

        const content = question.isForm ? icons.check : (i + 1);

        return `<button onclick="jumpToQuestion(${i})" class="w-7 h-7 rounded-full text-xs border flex items-center justify-center ${cls}">${content}</button>`;
      }).join('');

      app.innerHTML = `
        <section class="max-w-3xl mx-auto pt-16 md:pt-6 fade-in">
          <div class="flex flex-wrap gap-2 mb-6">${pills}</div>
          <div class="flex justify-between text-xs uppercase tracking-wider text-nordic-textSecondary mb-3">
            <span>${t('reportRequestTitle')}</span>
            <span class="text-brand-dark font-semibold">${clusterName('Report')}</span>
          </div>
          <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden mb-8">
            <div class="h-full bg-brand-dark transition-all duration-300" style="width:${progressPct}%"></div>
          </div>

          <div class="bg-white rounded-[28px] shadow-soft border border-gray-100 p-6 md:p-10">
             <div class="text-brand-xdark mb-5">${icons.clipboard}</div>
             <h2 class="text-2xl md:text-3xl font-light text-brand-xdark leading-snug max-w-2xl min-w-0 text-pretty mb-3">${t('reportRequestTitle')}</h2>
             <p class="text-nordic-textSecondary mb-8">${t('reportRequestText')}</p>

             <form id="report-form" class="space-y-5" onsubmit="submitReportRequest(event)">
              <div>
                <label for="contact-name" class="block text-sm font-medium mb-1">${t('nameLabel')}</label>
                <input id="contact-name" required class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-main" />
              </div>

              <div>
                <label for="contact-email" class="block text-sm font-medium mb-1">${t('emailLabel')}</label>
                <input id="contact-email" type="email" required class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-main" />
              </div>

              <div>
                <label for="contact-org" class="block text-sm font-medium mb-1">${t('orgLabel')}</label>
                <input id="contact-org" required class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-main" />
              </div>

              <div>
                <label for="contact-message" class="block text-sm font-medium mb-1">${t('noteLabel')}</label>
                <textarea id="contact-message" rows="3" class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-main"></textarea>
              </div>

              <div class="rounded-xl bg-brand-xlight border border-brand-light p-4">
                <label for="privacy-consent" class="grid grid-cols-[auto_1fr] gap-3 text-sm text-nordic-textPrimary leading-relaxed cursor-pointer">
                  <input
                    id="privacy-consent"
                    type="checkbox"
                    class="mt-1 h-4 w-4 rounded border-brand-main text-brand-xdark focus:ring-brand-dark cursor-pointer"
                    onchange="toggleSubmitButton()"
                    required
                  />
                  <span class="min-w-0 text-pretty select-none">
                    <span>${t('privacyBefore')}</span>
                    <a
                      href="${privacyLink()}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="text-brand-xdark font-medium underline hover:text-brand-dark"
                    >${t('privacyLink')}</a>
                    <span>${t('privacyAfter')}</span>
                  </span>
                </label>
              </div>

              <div class="mt-8 flex flex-col-reverse sm:flex-row items-center justify-between gap-4 pt-4 border-t border-gray-100">
                <button type="button" onclick="goBack()" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-4 py-3 rounded-2xl border border-gray-200 text-sm font-medium hover:bg-gray-50">
                  ${icons.arrowLeft} ${t('back')}
                </button>
                <button id="submit-request-button" type="submit" disabled class="w-full sm:w-auto px-8 py-3 rounded-2xl bg-brand-dark text-white font-medium hover:bg-brand-xdark disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                  ${t('submitRequest')}
                </button>
              </div>
            </form>
          </div>
        </section>
      `;
    }

    function renderLoading() {
      app.innerHTML = `
        <section class="min-h-[70vh] flex items-center justify-center fade-in pt-16 md:pt-6">
          <div class="text-center">
            <div class="w-14 h-14 mx-auto mb-5">
              <svg class="animate-spin text-gray-200" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle>
                <path fill="#BC36F0" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
            </div>
            <p class="text-xs uppercase tracking-[0.2em] text-brand-dark font-semibold mb-2">${t('loading')}</p>
            <p class="text-2xl font-light text-brand-xdark">${t('loadingText')}</p>
          </div>
        </section>
      `;
    }

    function renderSuccess() {
      app.innerHTML = `
        <section class="min-h-[70vh] flex items-center justify-center fade-in pt-16 md:pt-6">
          <div class="bg-white rounded-[28px] shadow-soft border border-gray-100 border-t-4 border-t-brand-dark p-8 md:p-12 max-w-lg w-full text-center">
            <div class="w-24 h-24 mx-auto bg-brand-xlight rounded-full flex items-center justify-center text-brand-dark mb-6 shadow-sm">
              <svg class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
              </svg>
            </div>
            <h2 class="text-3xl font-light text-brand-xdark mb-4">${t('successTitle')}</h2>
            <p class="text-nordic-textSecondary text-lg mb-10 leading-relaxed">${t('successText')}</p>
            <button onclick="restartQuiz()" class="px-8 py-3.5 rounded-2xl bg-brand-dark text-white font-medium hover:bg-brand-xdark transition-colors shadow-md">
              ${t('restart')}
            </button>
          </div>
        </section>
      `;
    }

    function toggleSubmitButton() {
      const checkbox = document.getElementById('privacy-consent');
      const button = document.getElementById('submit-request-button');
      if (checkbox && button) {
        button.disabled = !checkbox.checked;
      }
    }

    function submitReportRequest(event) {
      event.preventDefault();

      const consent = document.getElementById('privacy-consent');
      if (!consent || !consent.checked) {
        alert(t('privacyAlert'));
        return;
      }

      const name = document.getElementById('contact-name').value;
      const email = document.getElementById('contact-email').value;
      const org = document.getElementById('contact-org').value;
      const msg = document.getElementById('contact-message').value || '-';

      // Gather answers
      let answersText = questions.filter(q => !q.isForm).map((q, index) => {
        const rawValue = state.answers[index];
        let answerStr = "Keine Antwort";
        if (rawValue !== undefined) {
           const opt = answerScale.find(a => a.value === rawValue);
           if(opt) {
              answerStr = t('options')[opt.labelKey];
           }
        }
        return `Q${index + 1} (${clusterName(q.cluster)}): ${answerStr}`;
      }).join('\n');

      const subject = encodeURIComponent(`Anfrage Labor-Gesamtbericht: ${org}`);
      const bodyText = `Guten Tag,\n\nhiermit fordere ich den kostenlosen Gesamtbericht aus dem Labor-Potenzial-Rechner an.\n\nMeine Kontaktdaten:\nName: ${name}\nE-Mail: ${email}\nLabor/Organisation: ${org}\n\nBemerkung:\n${msg}\n\n---\nMeine Antworten im Potenzial-Rechner:\n\n${answersText}\n\nFreundliche Grüsse\n${name}`;
      const body = encodeURIComponent(bodyText);

      const mailtoUrl = `mailto:joel.sommer@roche.com?cc=janis.wipfli@roche.com&subject=${subject}&body=${body}`;

      const mailLink = document.createElement('a');
      mailLink.href = mailtoUrl;
      mailLink.style.display = 'none';
      document.body.appendChild(mailLink);

      if (navigator.clipboard) {
        navigator.clipboard.writeText(bodyText).catch(() => {});
      }

      window.open(mailtoUrl, '_blank');
      document.body.removeChild(mailLink);

      // Transition to loading then success
      state.step = 'loading';
      render();

      setTimeout(() => {
        state.step = 'success';
        clearAnswers(); // Clear answers after successful submission
        render();
        // Optional alert fallback for email client
        setTimeout(() => {
          alert('Die E-Mail wurde vorbereitet. Falls sich kein Mailfenster öffnet, ist auf diesem Gerät vermutlich kein Standard-Mailprogramm für mailto: verknüpft. Der Text wurde, wenn vom Browser erlaubt, zusätzlich in die Zwischenablage kopiert.');
        }, 300);
      }, 1200);
    }


    window.startQuiz = startQuiz;
    window.answerQuestion = answerQuestion;
    window.restartQuiz = restartQuiz;
    window.goBack = goBack;
    window.jumpToQuestion = jumpToQuestion;
    window.submitReportRequest = submitReportRequest;
    window.setLanguage = setLanguage;
    window.toggleSubmitButton = toggleSubmitButton;

    // Initial render
    render();
  </script>
</body>
</html>
